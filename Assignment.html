<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #f4f6f9;
}

/* Sidebar (desktop) */
.sidebar {
    background-color: #2c3e50;
    min-height: 100vh;
}

.sidebar a {
    color: white;
    display: block;
    padding: 12px;
    text-decoration: none;
}

.sidebar a:hover {
    background-color: #34495e;
}

/* Offcanvas same style */
.offcanvas {
    background-color: #2c3e50;
}

.offcanvas a {
    color: white;
    display: block;
    padding: 12px;
    text-decoration: none;
}
</style>
</head>

<body>

<!-- Top Navbar (only mobile) -->
<nav class="navbar navbar-dark bg-dark d-md-none">
    <div class="container-fluid">
        <!-- Hamburger -->
        <button class="btn btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
            ☰
        </button>
        <span class="navbar-brand">College Admin</span>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar (Desktop Only) -->
        <div class="col-md-2 sidebar d-none d-md-block p-0">
            <h4 class="text-white text-center py-3">College Admin</h4>
            <a href="#">Dashboard</a>
            <a href="#">Students</a>
            <a href="#">Faculty</a>
            <a href="#">Courses</a>
            <a href="#">Fees</a>
        </div>

        <div class="col-md-10 p-4">
            <h2>Dashboard</h2>

            <div class="row mt-3">
                <div class="col-md-3 col-sm-6">
                    <div class="card p-3">
                        <h5>Students</h5>
                        <h2>1200</h2>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="card p-3 ">
                        <h5>Faculty</h5>
                        <h2>1000</h2>
                    </div>
                </div>
                 <div class="col-md-3 col-sm-6">
                    <div class="card p-3 ">
                        <h5>Non-Teaching Staff</h5>
                        <h2>600</h2>
                    </div>
                </div>
            </div>
            

            <div class="mt-5">
                <h4>Fee Payment Status</h4>
                <table class="table table-bordered mt-3">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Fee Status</th>
                    </tr>
                    <tr>
                        <td>101</td>
                        <td>Payal</td>
                        <td>BCA</td>
                        <td><span class="badge bg-success">Paid</span></td>
                    </tr>
                </table>
            </div>

        </div>

    </div>
</div>



</body>
</html>
